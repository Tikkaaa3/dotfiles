################
### MONITORS ###
################

# 1. Laptop Screen (Left, 144Hz)
# Position: 0x0 (Start of the virtual desktop)
monitor = eDP-1, 1920x1080@144, 0x0, 1

# 2. External Monitor (Right, 60Hz)
# Position: 1920x0 (Starts exactly where the laptop screen ends)
monitor = DP-1, 1920x1080@60, 1920x0, 1

# Fallback rule (auto-configure any random monitors you plug in later)
monitor = , preferred, auto, 1

#############################
### WORKSPACE ASSIGNMENTS ###
#############################

# Bind Workspaces 1-5 to the Monitor (DP-1)
# These will always open on the right screen
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# Bind Workspaces 6-10 to the Laptop (eDP-1)
# These will always open on the left screen
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1


###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$browser = brave
$ai = brave --app=https://gemini.google.com/app
$fileManager = ghostty -e yazi
$menu = walker


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = SAL_USE_VCLPLUGIN,gtk3


###################
### PERMISSIONS ###
###################

